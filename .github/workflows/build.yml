name: Build UltraCam APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -iname 'UltraCam_v3.zip' -not -path './UltraCam/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "UltraCam_v3.zip repo me nahi mili. Files:"; ls -la
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf UltraCam
          unzip -q -o "$ZIP" -d UltraCam
          ls -la UltraCam

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: UltraCam
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraCam-debug-apk
          path: UltraCam/app/build/outputs/apk/debug/*.apk
